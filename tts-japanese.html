  <meta charset="UTF-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="読み上げ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>テキスト読み上げ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ダブルタップズームを全ボタン・入力欄で無効化 */
    button, input, a, [role="button"] { touch-action: manipulation; }

    :root {
      --green:   #1db954;
      --green-h: #1ed760;
      --bg:      #121212;
      --surface: #181818;
      --surface2:#282828;
      --surface3:#3e3e3e;
      --text:    #ffffff;
      --subtext: #b3b3b3;
      --radius:  8px;
    }

    body {
      font-family: "Circular", "Hiragino Sans", "Yu Gothic UI", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: grid;
      grid-template-rows: 1fr auto;
      overflow: hidden;
    }

    /* ── Main scroll area ── */
    .main {
      overflow-y: auto;
      padding: 14px 20px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      min-height: 0;
    }

    /* ── Text input panel ── */
    .text-panel {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-height: 0;
    }

    .text-panel-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }

    .episode-title {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--subtext);
    }

    .panel-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--subtext);
      margin-bottom: 6px;
    }

    textarea, .text-display {
      width: 100%;
      flex: 1;
      min-height: 80px;
      background: var(--surface2);
      border: 1px solid transparent;
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 0.9rem;
      font-family: inherit;
      color: var(--text);
      line-height: 1.7;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
    }
    textarea:focus { border-color: var(--subtext); }
    textarea::placeholder { color: var(--green); }

    .text-display {
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
      cursor: default;
    }
    .text-display mark {
      background: none;
      color: var(--green);
      font-weight: 700;
    }

    /* ── Progress bar ── */
    .progress-section {
      width: 100%;
      max-width: 480px;
    }

    .progress-bar-wrap {
      position: relative;
      height: 28px;
      display: flex;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .progress-bar-wrap.dragging { cursor: grabbing; }
    .progress-bar-wrap.dragging .progress-fill { background: var(--green); }
    .progress-bar-wrap.dragging .progress-thumb { opacity: 1; }

    .progress-track {
      position: absolute;
      left: 0; right: 0;
      height: 4px;
      background: var(--surface3);
      border-radius: 2px;
      pointer-events: none;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--subtext);
      border-radius: 2px;
      transition: background 0.1s;
      position: relative;
    }

    .progress-bar-wrap:hover .progress-fill { background: var(--green); }
    .progress-bar-wrap:hover .progress-thumb { opacity: 1; }

    .progress-thumb {
      position: absolute;
      right: -6px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text);
      opacity: 0;
      transition: opacity 0.1s;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 0.7rem;
      color: var(--subtext);
      font-weight: 500;
    }

    /* ── Player bar ── */
    .player-bar {
      background: var(--surface);
      border-top: 1px solid var(--surface2);
      padding: 16px 20px calc(env(safe-area-inset-bottom) + 20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ── Main controls ── */
    .main-controls {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 4px;
    }

    .ctrl-btn {
      background: none;
      border: none;
      color: var(--subtext);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .ctrl-btn:hover { color: var(--text); }
    .ctrl-btn:active { transform: scale(0.93); }
    .ctrl-btn:disabled { color: var(--surface3); cursor: not-allowed; transform: none; }

    .play-btn {
      width: 48px;
      height: 48px;
      background: var(--text);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, background 0.15s;
      flex-shrink: 0;
    }
    .play-btn:hover { transform: scale(1.06); background: #fff; }
    .play-btn:active { transform: scale(0.96); }
    .play-btn svg { color: #000; }

    .speed-btn {
      background: none;
      border: 1px solid var(--subtext);
      color: var(--subtext);
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 7px;
      min-width: 44px;
      text-align: center;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
      letter-spacing: 0.02em;
    }
    .speed-btn:hover { color: var(--text); border-color: var(--text); }

    /* ghost mirrors speed-btn for centering the play button */
    .ctrl-ghost {
      min-width: 44px;
      flex-shrink: 0;
    }

    /* ── Logo bar ── */
    .logo-bar {
      width: 100%;
      max-width: 480px;
      display: flex !important;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      visibility: visible !important;
    }
    .logo-text {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: #ffffff !important;
      line-height: 1;
    }
    .logo-status {
      margin-left: auto;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--green);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 160px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .logo-status.visible { opacity: 1; }
    .logo-status.error   { color: #e05c5c; }

    /* ── 先頭へ / 末尾へボタン ── */
    .scroll-top-btn, .scroll-bottom-btn {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--subtext);
      background: transparent;
      border: 1px solid var(--surface3);
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
    }
    .scroll-top-btn:hover, .scroll-bottom-btn:hover { color: var(--text); border-color: var(--subtext); }

    .scroll-btns {
      display: flex;
      gap: 6px;
    }

    /* ── 履歴ボタン ── */
    .hist-open-btn {
      background: none;
      border: none;
      color: var(--subtext);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: color 0.15s;
      flex-shrink: 0;
      min-width: 44px;
    }
    .hist-open-btn:hover { color: var(--text); }

    /* ── 履歴オーバーレイ ── */
    .hist-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .hist-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .hist-panel {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      background: var(--bg);
      border-radius: 16px 16px 0 0;
      padding: 0 0 env(safe-area-inset-bottom);
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.32,0.72,0,1);
    }
    .hist-overlay.open .hist-panel {
      transform: translateY(0);
    }

    .hist-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 12px;
      border-bottom: 1px solid var(--surface2);
      flex-shrink: 0;
    }
    .hist-panel-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text);
    }
    .hist-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .hist-clear-btn {
      background: none;
      border: 1px solid var(--surface3);
      color: var(--subtext);
      font-size: 0.72rem;
      font-weight: 600;
      border-radius: 6px;

    .hist-close-btn {

    .hist-list {

    .hist-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .hist-card-title {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;

    .hist-card-meta {

    .hist-card-meta span {

    .hist-card-preview {

      display: -webkit-box;

    .hist-delete-btn {

      color: var(--surface3);
      font-size: 0.9rem;
      cursor: pointer;
      padding: 2px 4px;
      flex-shrink: 0;
      transition: color 0.15s;
      line-height: 1;
    }
    .hist-delete-btn:hover { color: #e05c5c; }

    /* ── No support ── */
    .no-support {

      border-radius: var(--radius);

    /* ── URL取得エリア ── */
    .url-section {

    .url-trim-row.visible { display: flex; }

    .url-trim-btn {

    .url-trim-btn:disabled { opacity: 0.3; cursor: default; }
  </style>

  <!-- 履歴パネル -->
  <div class="hist-overlay" id="hist-overlay">
    <div class="hist-panel">
      <div class="hist-panel-header">
        <div class="hist-header-left">
          <button class="hist-clear-btn" id="hist-clear-btn">全削除</button>
          <div class="hist-panel-title">読み上げ履歴</div>
        </div>

  <script>
    const synth = window.speechSynthesis;
    if (!synth) document.getElementById('no-support').style.display = 'block';

    const textInput    = document.getElementById('text-input');
    const textDisplay  = document.getElementById('text-display');
    const btnPlayPause = document.getElementById('btn-play-pause');
    const btnStop      = document.getElementById('btn-stop');
    const btnRewind    = document.getElementById('btn-rewind');
    const iconPlay     = document.getElementById('icon-play');
    const iconPause    = document.getElementById('icon-pause');
    const progressFill = document.getElementById('progress-fill');
    const timeElapsed  = document.getElementById('time-elapsed');
    const timeRemain   = document.getElementById('time-remain');
    const episodeTitle = document.getElementById('episode-title');
    const speedBtn     = document.getElementById('speed-btn');

    const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];
    let speedIdx = 3;
    speedBtn.textContent = '1.25×';

    speedBtn.addEventListener('click', () => {
      speedIdx = (speedIdx + 1) % SPEEDS.length;
      const s = SPEEDS[speedIdx];
      speedBtn.textContent = s === 1 ? '1×' : s + '×';
      updateReadingTime();
      if (synth.speaking && !synth.paused) {
        synth.cancel();
        cancelAnimationFrame(rafId);
        startTime = Date.now();
        isPaused  = false;
        rafId = requestAnimationFrame(tickProgress);
        speakFrom(chunkIdx);
      }
    });

    // reading time display
    function updateReadingTime() {
      const t = textInput.value.trim();
      if (!t) { episodeTitle.textContent = '所要時間'; return; }
      const secs = Math.round(t.length / (5 * SPEEDS[speedIdx]));
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      episodeTitle.textContent = m > 0
        ? `約${m}分${s > 0 ? s + '秒' : ''}`
        : `約${s}秒`;
    }
    textInput.addEventListener('input', updateReadingTime);

    // ── Highlight helpers ──
    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlightAt(globalStart, len) {
      const text   = textInput.value;
      const end    = Math.min(globalStart + len, text.length);
      const before = escapeHtml(text.slice(0, globalStart));
      const word   = escapeHtml(text.slice(globalStart, end));
      const after  = escapeHtml(text.slice(end));
      textDisplay.innerHTML = before + '<mark>' + word + '</mark>' + after;
      const mark = textDisplay.querySelector('mark');
      if (mark) mark.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function showDisplay() {
      textInput.style.display   = 'none';
      textDisplay.style.display = 'block';
      textDisplay.textContent   = textInput.value;
    }

    function hideDisplay() {
      textDisplay.style.display = 'none';
      textDisplay.innerHTML    = '';
      textInput.style.display  = '';
    }

    // ── Progress / timer ──
    let startTime  = null;
    let totalChars = 0;
    let rafId      = null;
    let isPaused   = false;
    let pauseAt    = 0;

    function fmt(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }

    function estimateDuration(chars) {
      return chars / (5 * SPEEDS[speedIdx]);
    }

    function tickProgress() {
      if (!startTime) return;
      const secs  = (Date.now() - startTime) / 1000 + pauseAt;
      const total = estimateDuration(totalChars);
      const ratio = Math.min(secs / total, 1);
      progressFill.style.width = (ratio * 100) + '%';
      timeElapsed.textContent  = fmt(secs);
      timeRemain.textContent   = '-' + fmt(Math.max(0, total - secs));
      if (ratio < 1) rafId = requestAnimationFrame(tickProgress);
    }

    function setPlaying(playing) {
      iconPlay.style.display  = playing ? 'none' : '';
      iconPause.style.display = playing ? ''     : 'none';
      btnStop.disabled        = !playing && !isPaused;
      btnRewind.disabled      = !playing && !isPaused;
    }

    // ── Chunks ──
    let chunks      = [];
    let chunkStarts = [];
    let chunkIdx    = 0;
    let playingText = '';

    function buildChunks(text) {
      chunks      = text.match(/.{1,200}/g) || [text];
      chunkStarts = [];
      let pos = 0;
      chunks.forEach(c => { chunkStarts.push(pos); pos += c.length; });
    }

    function speakFrom(idx) {
      if (idx >= chunks.length) { stopAll(); return; }
      const utt  = new SpeechSynthesisUtterance(chunks[idx]);
      const all  = synth.getVoices();
      const v    = all.find(x => x.name === 'Kyoko') || all.find(x => x.lang.startsWith('ja')) || null;
      if (v) utt.voice = v;
      utt.lang = v ? v.lang : 'ja-JP';
      utt.rate  = SPEEDS[speedIdx];

      const chunkStart = chunkStarts[idx];
      utt.onboundary = (e) => {
        if (e.name !== 'word') return;
        highlightAt(chunkStart + e.charIndex, e.charLength || 1);
      };
      utt.onend   = () => { chunkIdx++; speakFrom(chunkIdx); };
      utt.onerror = (e) => {
        if (e.error !== 'interrupted' && e.error !== 'canceled') stopAll();
      };
      synth.speak(utt);
    }

    function startReading() {
      const text = textInput.value.trim();
      if (!text) { textInput.focus(); return; }
      if (typeof window._onStartReading === 'function') window._onStartReading(text);

      synth.cancel();
      buildChunks(text);
      playingText = text;
      chunkIdx   = 0;
      totalChars = text.length;
      pauseAt    = 0;
      startTime  = Date.now();
      isPaused   = false;

      showDisplay();
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(tickProgress);
      speakFrom(0);
      setPlaying(true);
    }

    function stopAll() {
      synth.cancel();
      cancelAnimationFrame(rafId);
      startTime = null;
      isPaused  = false;
      pauseAt   = 0;
      progressFill.style.width = '0%';
      timeElapsed.textContent  = '0:00';
      timeRemain.textContent   = '0:00';
      setPlaying(false);
      btnStop.disabled   = true;
      btnRewind.disabled = true;
      hideDisplay();
    }

    btnPlayPause.addEventListener('click', () => {
      if (!synth.speaking && !isPaused) {
        startReading();
      } else if (synth.speaking && !synth.paused) {
        synth.pause();
        isPaused  = true;
        pauseAt  += (Date.now() - startTime) / 1000;
        startTime = null;
        cancelAnimationFrame(rafId);
        hideDisplay();
        setPlaying(false);
        btnStop.disabled = false;
      } else if (isPaused) {
        if (textInput.value.trim() !== playingText) {
          startReading();
        } else {
          synth.resume();
          isPaused  = false;
          startTime = Date.now();
          showDisplay();
          rafId = requestAnimationFrame(tickProgress);
          setPlaying(true);
        }
      }
    });

    btnStop.addEventListener('click', stopAll);

    btnRewind.addEventListener('click', () => {
      const currentSecs = isPaused ? pauseAt : pauseAt + (Date.now() - startTime) / 1000;
      const targetSecs  = Math.max(0, currentSecs - 15);
      const targetChars = targetSecs * 5 * SPEEDS[speedIdx];
      const targetIdx   = Math.max(0, Math.min(chunks.length - 1, Math.floor(targetChars / 200)));

      synth.cancel();
      cancelAnimationFrame(rafId);
      chunkIdx  = targetIdx;
      pauseAt   = targetSecs;
      startTime = Date.now();
      isPaused  = false;
      rafId = requestAnimationFrame(tickProgress);
      speakFrom(chunkIdx);
      setPlaying(true);
    });

    // ── Progress bar drag ──
    const progressWrap = document.getElementById('progress-wrap');
    let isDragging = false;
    let wasPlaying = false;

    function getRatio(clientX) {
      const rect = progressWrap.getBoundingClientRect();
      return Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    }

    function applyRatioVisual(ratio) {
      progressFill.style.width = (ratio * 100) + '%';
      const total = estimateDuration(totalChars);
      const secs  = ratio * total;
      timeElapsed.textContent = fmt(secs);
      timeRemain.textContent  = '-' + fmt(Math.max(0, total - secs));
    }

    function seekToRatio(ratio) {
      if (!totalChars) return;
      const total      = estimateDuration(totalChars);
      const targetSecs = ratio * total;
      const targetIdx  = Math.max(0, Math.min(chunks.length - 1, Math.floor(ratio * totalChars / 200)));

      chunkIdx = targetIdx;
      pauseAt  = targetSecs;
      applyRatioVisual(ratio);

      if (wasPlaying) {
        startTime = Date.now();
        isPaused  = false;
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(tickProgress);
        speakFrom(chunkIdx);
        setPlaying(true);
      }
    }

    function onDragStart(clientX) {
      if (!totalChars) return;
      isDragging = true;
      wasPlaying = synth.speaking && !synth.paused;
      if (wasPlaying) { synth.cancel(); cancelAnimationFrame(rafId); }
      progressWrap.classList.add('dragging');
      applyRatioVisual(getRatio(clientX));
    }

    function onDragMove(clientX) {
      if (!isDragging) return;
      applyRatioVisual(getRatio(clientX));
    }

    function onDragEnd(clientX) {
      if (!isDragging) return;
      isDragging = false;
      progressWrap.classList.remove('dragging');
      seekToRatio(getRatio(clientX));
    }

    progressWrap.addEventListener('mousedown',  (e) => { onDragStart(e.clientX); e.preventDefault(); });
    document.addEventListener('mousemove',      (e) => onDragMove(e.clientX));
    document.addEventListener('mouseup',        (e) => onDragEnd(e.clientX));

    progressWrap.addEventListener('touchstart', (e) => onDragStart(e.touches[0].clientX), { passive: true });
    document.addEventListener('touchmove',      (e) => { if (isDragging) onDragMove(e.touches[0].clientX); }, { passive: true });
    document.addEventListener('touchend',       (e) => onDragEnd(e.changedTouches[0].clientX));

    window.addEventListener('beforeunload', () => synth.cancel());

    // Prevent pinch zoom on iOS Safari (ignores user-scalable=no since iOS 10)
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1) e.preventDefault();
    }, { passive: false });
    let lastTap = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTap < 300) e.preventDefault();
      lastTap = now;
    }, { passive: false });

    // ── 記事テキスト抽出 ──
    (function() {
      const urlInput     = document.getElementById('url-input');
      const urlFetchBtn  = document.getElementById('url-fetch-btn');
      const urlStatus    = document.getElementById('url-status');
      const urlTrimRow   = document.getElementById('url-trim-row');
      const trimTopBtn   = document.getElementById('url-trim-top');
      const trimBottomBtn= document.getElementById('url-trim-bottom');
      const undoBtn      = document.getElementById('url-undo-btn');

      const trimHistory = [];

      function setUrlStatus(msg, type = '') {
        urlStatus.textContent = msg;
        urlStatus.className = 'logo-status' + (msg ? ' visible' : '') + (type ? ' ' + type : '');
      }

      function saveTrimHistory() {
        trimHistory.push(textInput.value);
        undoBtn.disabled = false;
      }

      function applyText(text) {
        textInput.value = text;
        textInput.dispatchEvent(new Event('input'));
      }

      // Jina Reader
      async function fetchViaJina(url) {
        const res = await fetch(`https://r.jina.ai/${url}`, {
          signal: AbortSignal.timeout(20000),
          headers: { 'Accept': 'text/plain' }
        });
        if (!res.ok) throw new Error('Jina失敗');
        const text = await res.text();
        if (!text || text.length < 100) throw new Error('内容なし');
        if (text.includes('"code":451') || text.includes('SecurityCompromiseError') ||
            (text.includes('Access Denied') && text.length < 500)) throw new Error('BLOCKED');
        return text;
      }

      // CORSプロキシ + Readability
      async function fetchViaProxy(url) {
        const res = await fetch(`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`, {
          signal: AbortSignal.timeout(12000)
        });
        if (!res.ok) throw new Error('プロキシ失敗');
        const html = await res.text();
        if (!html || !html.includes('<') || html.includes('Access Denied') || html.length < 500)
          throw new Error('BLOCKED');
        return html;
      }

      function jinaToPlain(raw) {
        let text = raw.replace(/^(Title|URL Source|Published Time|Markdown Content):.*$/gm, '').trim();
        text = text.replace(/^#{1,6}\s+/gm, '');
        text = text.replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
        text = text.replace(/!\[[^\]]*\]\([^)]+\)/g, '');
        text = text.replace(/\*{1,2}([^*]+)\*{1,2}/g, '$1');
        text = text.replace(/^[-*_]{3,}\s*$/gm, '');
        text = text.replace(/\r\n/g, '\n').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
        return text;
      }

      function htmlToPlain(html, url) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const base = doc.createElement('base');
        base.href = url;
        doc.head.prepend(base);
        const NOISE = ['header','footer','nav','aside','form','script','style','noscript','iframe',
          '[class*="ad"]','[class*="banner"]','[class*="promo"]','[class*="related"]',
          '[class*="recommend"]','[class*="ranking"]','[class*="sidebar"]','[class*="widget"]',
          '[class*="subscribe"]','[class*="newsletter"]','[class*="pickup"]','[class*="share"]',
          '[class*="social"]','[class*="comment"]','[id*="ad"]','[id*="sidebar"]','[id*="related"]',
          '[role="complementary"]','[role="navigation"]','[role="banner"]'].join(',');
        doc.querySelectorAll(NOISE).forEach(el => el.remove());
        const article = new Readability(doc, { charThreshold: 20 }).parse();
        if (!article || !article.textContent.trim()) throw new Error('本文抽出失敗');
        return article.textContent.replace(/\r\n/g,'\n').replace(/[ \t]+\n/g,'\n').replace(/\n{3,}/g,'\n\n').trim();
      }

      urlFetchBtn.addEventListener('click', async () => {
        const url = urlInput.value.trim();
        if (!url) { setUrlStatus('URLを入力してください', 'error'); return; }
        if (!/^https?:\/\//.test(url)) { setUrlStatus('https:// から始まるURLを入力してください', 'error'); return; }

        urlFetchBtn.disabled = true;
        urlTrimRow.classList.remove('visible');
        trimHistory.length = 0;
        undoBtn.disabled = true;
        setUrlStatus('取得中…');

        try {
          let cleaned = '', fetchedTitle = '';
          try {
            setUrlStatus('取得中… (1/2)');
            const raw = await fetchViaJina(url);
            const titleMatch = raw.match(/^Title:\s*(.+)$/m);
            fetchedTitle = titleMatch ? titleMatch[1].trim() : '';
            cleaned = jinaToPlain(raw);
            if (cleaned.length < 100) throw new Error('短すぎる');
          } catch (e) {
            if (e.message === 'BLOCKED') throw e;
            setUrlStatus('取得中… (2/2)');
            const html = await fetchViaProxy(url);
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');
            fetchedTitle = doc.title || '';
            cleaned = htmlToPlain(html, url);
          }

          applyText(cleaned);
          window._articleMeta = { url, title: fetchedTitle, text: cleaned };
          urlTrimRow.classList.add('visible');
          setUrlStatus('抽出完了！', 'success');
        } catch (e) {
          if (e.message === 'BLOCKED') {
            setUrlStatus('このサイトは自動取得をブロックしています。ブラウザで記事を開き、テキストを手動でコピーしてください。', 'error');
          } else {
            setUrlStatus('取得できませんでした。対応していないサイトの可能性があります。', 'error');
          }
        } finally {
          urlFetchBtn.disabled = false;
        }
      });

      urlInput.addEventListener('keydown', e => { if (e.key === 'Enter') urlFetchBtn.click(); });

      // 先頭へ / 末尾へボタン
      document.getElementById('scroll-top-btn').addEventListener('click', () => {
        textInput.scrollTop = 0;
      });
      document.getElementById('scroll-bottom-btn').addEventListener('click', () => {
        textInput.scrollTop = textInput.scrollHeight;
      });

      trimTopBtn.addEventListener('click', () => {
        saveTrimHistory();
        const text = textInput.value;
        const idx = text.indexOf('\n\n');
        textInput.value = idx !== -1 ? text.slice(idx + 2).trimStart()
          : text.slice(text.indexOf('\n') + 1).trimStart();
        textInput.dispatchEvent(new Event('input'));
      });

      trimBottomBtn.addEventListener('click', () => {
        saveTrimHistory();
        const text = textInput.value.trimEnd();
        const idx = text.lastIndexOf('\n\n');
        textInput.value = idx !== -1 ? text.slice(0, idx).trimEnd()
          : text.slice(0, text.lastIndexOf('\n')).trimEnd();
        textInput.dispatchEvent(new Event('input'));
      });

      undoBtn.addEventListener('click', () => {
        if (!trimHistory.length) return;
        textInput.value = trimHistory.pop();
        textInput.dispatchEvent(new Event('input'));
        if (!trimHistory.length) undoBtn.disabled = true;
      });
    })();

    // ── 読み上げ履歴 ──
    (function() {
      const STORAGE_KEY = 'tekiyomi_history';
      const MAX_ENTRIES = 50;

      const overlay    = document.getElementById('hist-overlay');
      const openBtn    = document.getElementById('hist-open-btn');
      const closeBtn   = document.getElementById('hist-close-btn');
      const clearBtn   = document.getElementById('hist-clear-btn');
      const listEl     = document.getElementById('hist-list');

      // ── ストレージ操作 ──
      function loadHistory() {
        try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
        catch { return []; }
      }
      function saveHistory(entries) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      }
      function addEntry(entry) {
        const entries = loadHistory().filter(e => e.text !== entry.text);
        entries.unshift(entry);
        if (entries.length > MAX_ENTRIES) entries.length = MAX_ENTRIES;
        saveHistory(entries);
      }
      function deleteEntry(id) {
        saveHistory(loadHistory().filter(e => e.id !== id));
      }

      // ── 再生開始時に履歴保存（startReading()のフック経由） ──
      let lastSavedText = '';
      window._onStartReading = function(text) {
        if (!text || text === lastSavedText) return;
        const meta = window._articleMeta;
        const isSameFetch = meta && meta.text === text;
        const title = isSameFetch && meta.title ? meta.title
          : (text.split('\n').find(l => l.trim()) || '').slice(0, 50);
        addEntry({
          id: Date.now(),
          title,
          text,
          url: isSameFetch ? meta.url : null,
        });
        lastSavedText = text;
      };

      // ── 表示ヘルパー ──
      function formatDate(ts) {
        const d = new Date(ts), now = new Date(), diff = now - d;
        if (diff < 60000)     return 'たった今';
        if (diff < 3600000)   return `${Math.floor(diff/60000)}分前`;
        if (diff < 86400000)  return `${Math.floor(diff/3600000)}時間前`;
        if (diff < 604800000) return `${Math.floor(diff/86400000)}日前`;
        return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
      }
      function getHostname(url) {
        try { return new URL(url).hostname; } catch { return ''; }
      }
      function esc(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      // ── リスト描画 ──
      function render() {
        const entries = loadHistory();
        clearBtn.disabled = entries.length === 0;

        if (entries.length === 0) {
          listEl.innerHTML = '<div class="hist-empty">まだ履歴がありません。<br>再生ボタンを押すと記録されます。</div>';
          return;
        }

        listEl.innerHTML = '';
        entries.forEach(entry => {
          const card = document.createElement('div');
          card.className = 'hist-card';
          card.innerHTML = `
            <div class="hist-card-body">
              <div class="hist-card-title">${esc(entry.title || '（無題）')}</div>
              <div class="hist-card-meta">
                <span>${formatDate(entry.id)}</span>
                <span>${entry.text.length.toLocaleString()}文字</span>
                ${entry.url ? `<span class="meta-url">${esc(getHostname(entry.url))}</span>` : ''}
              </div>
              <div class="hist-card-preview">${esc(entry.text.replace(/\n+/g,' ').slice(0,60))}</div>
            </div>
            <button class="hist-delete-btn" data-id="${entry.id}" title="削除">✕</button>
          `;

          // カードタップ → テキスト読み込み＆パネルを閉じる
          card.addEventListener('click', (e) => {
            if (e.target.classList.contains('hist-delete-btn')) return;
            textInput.value = entry.text;
            textInput.dispatchEvent(new Event('input'));
            window._articleMeta = { url: entry.url, title: entry.title, text: entry.text };
            lastSavedText = entry.text;
            closePanel();
          });

          // 削除ボタン
          card.querySelector('.hist-delete-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            deleteEntry(entry.id);
            render();
          });

          listEl.appendChild(card);
        });
      }

      // ── パネル開閉 ──
      function openPanel() { overlay.classList.add('open'); render(); }
      function closePanel() { overlay.classList.remove('open'); }

      openBtn.addEventListener('click', openPanel);
      closeBtn.addEventListener('click', closePanel);
      overlay.addEventListener('click', (e) => { if (e.target === overlay) closePanel(); });

      clearBtn.addEventListener('click', () => {
        if (!confirm('履歴をすべて削除しますか？')) return;
        saveHistory([]);
        render();
      });
    })();
  </script>
</body>
</html>
